<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья — Я&В</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="main-page">

    <div class="main-gradient-wrapper">
        <div id="header-placeholder"></div>

        <article class="single-article-container" style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
            <div id="article-content">
                <p style="text-align: center; color: #888;">Загрузка статьи...</p>
            </div>
        </article>
    </div>

    <div id="footer-placeholder"></div>

    <script>
    // Проверяем авторизацию: если пользователь не залогинен, сразу отправляем на вход
    if (!localStorage.getItem('user')) {
        window.location.href = 'login.html';
    }

    async function loadComponent(elementId, filePath) {
        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const html = await response.text();
            document.getElementById(elementId).innerHTML = html;
        } catch (err) {
            console.error(`Ошибка загрузки ${filePath}:`, err);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadComponent('header-placeholder', 'header.html');
        loadComponent('footer-placeholder', 'footer.html');

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        if (!articleId) {
            document.getElementById('article-content').innerHTML = '<h2>Статья не найдена</h2>';
            return;
        }

        fetch(`http://localhost:3000/api/articles/${articleId}`)
            .then(res => {
                if (!res.ok) throw new Error('Статья не найдена');
                return res.json();
            })
            .then(article => {
                let parsedContent = [];
                try {
                    parsedContent = typeof article.contentJson === 'string' 
                        ? JSON.parse(article.contentJson) 
                        : (article.contentJson || []);
                } catch (e) {
                    console.error('Ошибка парсинга контента статьи:', e);
                }

                const contentHtml = parsedContent.map(block => {
                    if (block.type === 'paragraph') {
                        return `<p class="article-paragraph">${block.text}</p>`;
                    } else if (block.type === 'heading') {
                        return `<h3 class="article-subheading">${block.text}</h3>`;
                    } else if (block.type === 'image') {
                        return `<img src="${block.src}" alt="${block.caption || ''}" class="article-inner-image">`;
                    }
                    return '';
                }).join('');

                const formattedDate = new Date(article.createdAt).toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });

                document.getElementById('article-content').innerHTML = `
                    <div class="article-header" style="text-align: center; margin-bottom: 30px;">
                        <span class="card-category-tag">${article.category}</span>
                        <h1 style="font-size: 32px; margin: 15px 0; font-family: 'Playfair Display', serif;">${article.title}</h1>
                        <div class="article-meta" style="color: #888; font-size: 14px;">
                            <span>Автор: <strong>${article.authorName}</strong></span> • <span>${formattedDate}</span>
                        </div>
                    </div>
                    
                    ${article.coverUrl ? `<img src="${article.coverUrl}" alt="${article.title}" style="width: 100%; max-height: 450px; object-fit: cover; border-radius: 12px; margin-bottom: 30px;">` : ''}

                    <div class="article-body-text" style="line-height: 1.8; font-size: 16px; color: #d1cfdd;">
                        ${contentHtml || `<p>${article.excerpt}</p>`}
                    </div>
                `;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('article-content').innerHTML = '<h2>Не удалось загрузить статью</h2>';
            });
    });
    </script>
</body>
</html>
